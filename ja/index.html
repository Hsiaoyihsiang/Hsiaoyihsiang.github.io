<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>蕭亦翔 Hsiao Yi-Hsiang｜学術ウェブサイト</title>

    <meta name="description"
          content="蕭亦翔（Hsiao Yi-Hsiang）の学術ウェブサイト日本語版。">

    <!--
        日本語版の内容が完成するまでは
        Googleなどの検索結果に表示させません。
        完成後にこの行を削除します。
    -->
    <meta name="robots"
          content="noindex, follow">

    <link rel="canonical"
          href="https://hsiaoyihsiang.github.io/ja/">

    <link rel="alternate"
          hreflang="zh-Hant"
          href="https://hsiaoyihsiang.github.io/">

    <link rel="alternate"
          hreflang="ja"
          href="https://hsiaoyihsiang.github.io/ja/">

    <link rel="alternate"
          hreflang="x-default"
          href="https://hsiaoyihsiang.github.io/">

    <link rel="stylesheet"
          href="../style.css">
</head>


<body>

    <!-- =========================
         頁首
    ========================== -->

    <header class="site-header">

        <div class="header-inner">

            <div class="site-title">
                <a href="#top">蕭亦翔</a>
            </div>


            <div class="header-actions">

                <div class="language-switch"
                     aria-label="言語選択">

                    <a class="language-link"
                       href="/"
                       lang="zh-Hant"
                       hreflang="zh-Hant">
                        中文
                    </a>

                    <span class="language-separator">｜</span>

                    <a class="language-link active"
                       href="/ja/"
                       lang="ja"
                       hreflang="ja"
                       aria-current="page">
                        日本語
                    </a>

                </div>

            </div>

        </div>

    </header>


    <!-- =========================
         主要內容
    ========================== -->

    <main id="top">

        <section class="hero">

            <div class="hero-name">

                <h1>
                    蕭亦翔
                </h1>

                <p class="hero-name-en">
                    Hsiao Yi-Hsiang
                </p>

            </div>


            <p class="hero-description">
                日本語版を準備中です。
            </p>


            <div class="hero-divider"></div>


            <p class="hero-contact">

                連絡先：

                <a class="text-link"
                   href="mailto:flymaple777@gmail.com">
                    flymaple777@gmail.com
                </a>

            </p>

        </section>

    </main>


    <!-- =========================
         頁尾
    ========================== -->

    <footer>

        <div class="footer-inner">

            <p>
                © 2026 蕭亦翔 Hsiao Yi-Hsiang
            </p>

            <p class="footer-note">
                Academic Website
            </p>

        </div>

    </footer>


</body>

</html>
